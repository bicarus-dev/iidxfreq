[iidxfreq]
; Restart after INI edits; hotkey changes apply to the next song only.

; 0=disabled, 1=enabled
enabled=1

; Initial song speed: 0.5-2.0 (0.8 = 20% slower, 1.2 = 20% faster)
speed=1.0

; 0=pitch follows speed, 1=preserve pitch
preserve_pitch=0

; Increase speed: Windows VK code, decimal or hex (0x24=Home)
increase_key=0x24

; Decrease speed: Windows VK code (0x23=End)
decrease_key=0x23

; Reset to 1.0x: Windows VK code
reset_key=0

; Toggle preserve pitch for the next song: Windows VK code (0x50=p)
preserve_pitch_key=0x50

; Require hotkey modifiers: 0=none, Ctrl=1, Alt=2, Shift=4; add to combine
key_modifiers=0

; Speed change per press: 0.01-1.00 in increments of 0.01
speed_step=0.05